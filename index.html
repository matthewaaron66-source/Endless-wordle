<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Endless Worldle</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0c10" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🌍</div>
      <div>
        <div class="title">Endless Worldle</div>
        <div class="subtitle">Unlimited guesses • Endless rounds</div>
      </div>
    </div>

    <button id="statsBtn" class="iconBtn" aria-label="Stats">📊</button>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="silhouette" aria-label="Country silhouette">
        <svg id="svg" viewBox="0 0 1000 780" role="img" aria-label="Silhouette SVG"></svg>
      </div>

      <div class="meta">
        <div>Guesses: <span id="guessCount">0</span></div>
        <div>Round: <span id="roundCount">1</span></div>
        <div>Streak: <span id="streakCount">0</span></div>
      </div>

      <div class="row">
        <input id="guessInput"
               list="countriesList"
               placeholder="Type a country…"
               autocomplete="off"
               autocapitalize="words"
               inputmode="text" />
        <button id="guessBtn" class="primary">Guess</button>
        <button id="skipBtn" class="ghost" title="Skip this round">Skip</button>
      </div>

      <datalist id="countriesList"></datalist>

      <div class="status" id="status">Loading map data…</div>

      <div class="hintbar">
        <div class="hintrow">
          <div class="hintlabel">Proximity</div>
          <div class="hintvalue"><span id="proxPct">—</span>%</div>
        </div>
        <div class="progress">
          <div id="proxFill" class="fill" style="width:0%"></div>
        </div>
        <div class="small">Closer guesses raise the bar. 100% = correct.</div>
      </div>

      <div class="guesslog" id="guessLog" aria-label="Guess history"></div>

      <div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="statsModal" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-label="Stats">
      <div class="modalHeader">
        <div class="modalTitle">Stats</div>
        <button id="closeStatsBtn" class="iconBtn" aria-label="Close">✖️</button>
      </div>

      <div class="statsGrid">
        <div class="statBox"><div class="k">Rounds</div><div class="v" id="sRounds">0</div></div>
        <div class="statBox"><div class="k">Wins</div><div class="v" id="sWins">0</div></div>
        <div class="statBox"><div class="k">Win %</div><div class="v" id="sWinPct">0</div></div>
        <div class="statBox"><div class="k">Avg guesses</div><div class="v" id="sAvgGuesses">0</div></div>
        <div class="statBox"><div class="k">Best streak</div><div class="v" id="sBestStreak">0</div></div>
        <div class="statBox"><div class="k">Current streak</div><div class="v" id="sStreak">0</div></div>
      </div>

      <div class="modalFooter">
        <button id="resetStatsBtn" class="danger">Reset stats</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
